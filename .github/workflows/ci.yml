name: PR Integrity

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v7

          - uses: actions/setup-go@v7
            with:
              go-version-file: go.mod
              cache: true
          
          - name: Run vet
            run: go vet ./...

          - name: Run unit tests
            run: go test -race ./...
